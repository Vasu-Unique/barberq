[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barberq-api"
version = "1.0.0"
description = "BarberQ - Smart queues. Better grooming. Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.1.0",

    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",

    "alembic>=1.13.1",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

